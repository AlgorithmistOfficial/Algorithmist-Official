<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 78" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&amp;family=Inter:wght@600;700&amp;display=swap');
      .algo-wordmark {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .algo-tagline {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 2.8px;
      }
    </style>
  </defs>
  <!-- Main Brand Wordmark -->
  <text x="0" y="44" class="algo-wordmark">
    <tspan fill="#172940">A</tspan>
    <tspan fill="#E66A23">L</tspan>
    <tspan fill="#172940">gorithmist</tspan>
  </text>
  <!-- Signature Orange Dot over 'i' -->
  <circle cx="282" cy="18" r="3.2" fill="#E66A23" />
  <!-- Cropped Tagline Section -->
  <g transform="translate(0, 56)">
    <line x1="2" y1="12" x2="28" y2="12" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="36" y="15" fill="#344257" class="algo-tagline">
      LOGIC <tspan fill="#E66A23">·</tspan> INNOVATION <tspan fill="#E66A23">·</tspan> IMPACT
    </text>
    <line x1="316" y1="12" x2="342" y2="12" stroke="#CBD5E1" stroke-width="1.2" />
  </g>
</svg>